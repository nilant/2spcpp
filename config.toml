[collect]
merge_cells = false
execs = ["bottom_left", "coord_single"]
instance_index = [ "alpha", "ntasks", "seed", "rmax", "wmax"]
instance_fields = ["W", "nitems", "reff", "lb"]
exec_fields = ["obj", "bound", "runtime"]

[cluster]
indices = [0, 1, 2, 4, 5, 6, 7]
remote_dir = "packing" 
data_dir = "all"

[benchmarks]
execs = ["bottom_left", "coord_single"]
timelimit = 3600
memlimit = 15
iterlimit = 0
threads = 1
seed = 0
